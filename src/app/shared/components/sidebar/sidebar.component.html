<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-logo">
    <mat-icon class="logo-icon">precision_manufacturing</mat-icon>
    @if (!collapsed) {
      <span class="logo-text">EquipWatch</span>
    }
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      @if (isVisible(item)) {
        <a class="nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           [matTooltip]="collapsed ? item.label : ''"
           matTooltipPosition="right">
          <mat-icon>{{ item.icon }}</mat-icon>
          @if (!collapsed) {
            <span>{{ item.label }}</span>
          }
        </a>
      }
    }
  </nav>

  <button class="sidebar-toggle" (click)="toggle.emit()" [matTooltip]="collapsed ? 'Развернуть' : 'Свернуть'" matTooltipPosition="right">
    <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
  </button>
</aside>
