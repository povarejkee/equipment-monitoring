<header class="app-header">
  <div class="header-left">
    <button mat-icon-button (click)="menuToggle.emit()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="page-title">Мониторинг оборудования</span>
  </div>

  <div class="header-right">
    <button mat-icon-button
            [routerLink]="['/notifications']"
            matTooltip="Уведомления"
            class="notif-btn">
      <mat-icon
        [matBadge]="(unreadCount$ | async) || null"
        matBadgeColor="warn"
        matBadgeSize="small">
        notifications
      </mat-icon>
    </button>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ auth.currentUser?.name }}</span>
      <mat-icon class="arrow-icon">arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="user-menu-header">
        <div class="user-email">{{ auth.currentUser?.email }}</div>
        <div class="user-role">{{ auth.currentUser?.role }}</div>
      </div>
      <button mat-menu-item [routerLink]="['/settings']">
        <mat-icon>settings</mat-icon> Настройки
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon> Выйти
      </button>
    </mat-menu>
  </div>
</header>
