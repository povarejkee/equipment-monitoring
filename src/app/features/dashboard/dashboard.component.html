<div class="dashboard-page">
  <div class="page-header">
    <h1 class="page-title">Дашборд</h1>
    <p class="page-subtitle">Мониторинг производственного оборудования в реальном времени</p>
  </div>

  @if (state$ | async; as state) {
    @if (state.status === 'loaded') {
      <app-stats-summary [machines]="state.machines"></app-stats-summary>
      <app-machine-grid [machines]="state.machines"></app-machine-grid>
    } @else if (state.status === 'error') {
      <div class="load-error">
        <span>Не удалось загрузить список станков.</span>
      </div>
    } @else {
      <app-loading-spinner></app-loading-spinner>
    }
  }
</div>
