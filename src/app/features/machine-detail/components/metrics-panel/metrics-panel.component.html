<div class="metrics-grid">
  @for (item of visibleMetrics; track item.key) {
    <div class="metric-card" [class]="'level-' + getLevel(item)">
      <div class="metric-header">
        <mat-icon class="metric-icon">{{ item.icon }}</mat-icon>
        <span class="metric-label">{{ item.label }}</span>
      </div>
      <div class="metric-value">
        {{ formatValue(item) }}
        <span class="metric-unit">{{ item.unit }}</span>
      </div>
      @if (item.warnThreshold !== undefined) {
        <div class="metric-thresholds">
          <span class="threshold warn">⚠ {{ item.warnThreshold }}</span>
          <span class="threshold crit">✕ {{ item.critThreshold }}</span>
        </div>
      }
    </div>
  }
</div>
